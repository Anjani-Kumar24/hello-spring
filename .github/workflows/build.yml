name: Java Build Pipeline

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java (stable version)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # Step 3: Build WITHOUT tests
      - name: Build project (skip tests)
        run: mvn clean package -DskipTests
